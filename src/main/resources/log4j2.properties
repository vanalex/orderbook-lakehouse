# Spark/Iceberg/Hadoop log at WARN so job output (println, df.show) stays
# readable. Raise to info here when debugging.
rootLogger.level = warn
rootLogger.appenderRef.console.ref = console

appender.console.type = Console
appender.console.name = console
appender.console.target = SYSTEM_ERR
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{HH:mm:ss} %p %c{1}: %m%n

# Harmless on macOS/local mode, but printed on every run.
logger.nativecode.name = org.apache.hadoop.util.NativeCodeLoader
logger.nativecode.level = error

# Iceberg 1.9 warns on every session that the REST catalog's own
# /v1/oauth/tokens endpoint is deprecated (iceberg#10537), even when
# oauth2-server-uri points at it explicitly. Polaris without an external IdP
# only has that endpoint, so the warning can't be fixed here.
logger.icebergoauth.name = org.apache.iceberg.rest.auth.OAuth2Manager
logger.icebergoauth.level = error

# S3A looks for a metrics config file we don't ship; harmless.
logger.hadoopmetrics.name = org.apache.hadoop.metrics2.impl.MetricsConfig
logger.hadoopmetrics.level = error
